name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./build.sh --zip
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Aries-Dynamic-Island
          path: build/*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          generate_release_notes: true
